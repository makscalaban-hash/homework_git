[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = "Project for masking bank operations"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "masks", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.0"
black = "^24.4.2"
isort = "^5.13.2"
mypy = "^1.10.0"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
